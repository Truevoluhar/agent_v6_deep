active_provider: ${ACTIVE_PROVIDER:-bifrost}

llm:
  thinking_enabled: ${LLM_THINKING_ENABLED:-false}
  max_output_tokens: ${LLM_MAX_OUTPUT_TOKENS:-150000}

providers:
  openai:
    type: openai_compatible
    model: gpt-5.5
    base_url: https://api.openai.com/v1
    api_key: ${OPENAI_API_KEY}
    temperature: 0
    timeout_seconds: 500
    max_retries: 3
    thinking_control: reasoning_effort

  bifrost:
    type: bifrost_gateway
    model: ${BIFROST_MODEL:-openai/gpt-4o-mini}
    base_url: ${BIFROST_BASE_URL:-http://host.docker.internal:8080/openai}
    api_key: ${BIFROST_API_KEY:-dummy-key}
    temperature: 0
    timeout_seconds: 500
    max_retries: 2
    thinking_control: chat_template_kwargs
    tls_verify: ${BIFROST_TLS_VERIFY:-true}
    tls_ca_file: ${BIFROST_CA_FILE:-}
    tls_ca_path: ${BIFROST_CA_PATH:-}
    tls_client_cert_file: ${BIFROST_CLIENT_CERT_FILE:-}
    tls_client_key_file: ${BIFROST_CLIENT_KEY_FILE:-}
    tls_client_key_password: ${BIFROST_CLIENT_KEY_PASSWORD:-}

  vllm:
    type: openai_compatible
    model: openai/gpt-oss-120b
    base_url: ${VLLM_BASE_URL:-http://host.docker.internal:8000/v1}
    api_key: ${VLLM_API_KEY:-dummy}
    temperature: 0
    timeout_seconds: 500
    max_retries: 2
    thinking_control: chat_template_kwargs
    tls_verify: ${VLLM_TLS_VERIFY:-true}
    tls_ca_file: ${VLLM_CA_FILE:-}
    tls_ca_path: ${VLLM_CA_PATH:-}
    tls_client_cert_file: ${VLLM_CLIENT_CERT_FILE:-}
    tls_client_key_file: ${VLLM_CLIENT_KEY_FILE:-}
    tls_client_key_password: ${VLLM_CLIENT_KEY_PASSWORD:-}
