active_provider: ${ACTIVE_PROVIDER:-openai}

providers:
  openai:
    type: openai_compatible
    model: gpt-5.5
    base_url: https://api.openai.com/v1
    api_key: ${OPENAI_API_KEY}
    temperature: 0
    timeout_seconds: 180
    max_retries: 3

  bifrost:
    type: bifrost_gateway
    model: ${BIFROST_MODEL:-openai/gpt-4o-mini}
    base_url: ${BIFROST_BASE_URL:-http://host.docker.internal:8080/openai}
    api_key: ${BIFROST_API_KEY:-dummy-key}
    temperature: 0
    timeout_seconds: 180
    max_retries: 2

  vllm:
    type: openai_compatible
    model: openai/gpt-oss-120b
    base_url: ${VLLM_BASE_URL:-http://host.docker.internal:8000/v1}
    api_key: ${VLLM_API_KEY:-dummy}
    temperature: 0
    timeout_seconds: 180
    max_retries: 2
    tls_verify: ${VLLM_TLS_VERIFY:-true}
    tls_ca_file: ${VLLM_CA_FILE:-}
    tls_ca_path: ${VLLM_CA_PATH:-}
    tls_client_cert_file: ${VLLM_CLIENT_CERT_FILE:-}
    tls_client_key_file: ${VLLM_CLIENT_KEY_FILE:-}
    tls_client_key_password: ${VLLM_CLIENT_KEY_PASSWORD:-}
