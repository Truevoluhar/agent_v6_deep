<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tic Tac Toe</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="game-wrapper">
    <section class="game-card" aria-labelledby="game-title">
      <p class="eyebrow">Simple JavaScript Game</p>
      <h1 id="game-title">Tic Tac Toe</h1>

      <div class="scoreboard" aria-label="Scoreboard">
        <div>
          <span class="score-label">Player X</span>
          <strong id="xScore">0</strong>
        </div>
        <div>
          <span class="score-label">Draws</span>
          <strong id="drawScore">0</strong>
        </div>
        <div>
          <span class="score-label">Player O</span>
          <strong id="oScore">0</strong>
        </div>
      </div>

      <p id="status" class="status" role="status" aria-live="polite">Player X's turn</p>

      <div id="board" class="board" aria-label="Tic Tac Toe board">
        <button class="cell" data-index="0" aria-label="Row 1 column 1"></button>
        <button class="cell" data-index="1" aria-label="Row 1 column 2"></button>
        <button class="cell" data-index="2" aria-label="Row 1 column 3"></button>
        <button class="cell" data-index="3" aria-label="Row 2 column 1"></button>
        <button class="cell" data-index="4" aria-label="Row 2 column 2"></button>
        <button class="cell" data-index="5" aria-label="Row 2 column 3"></button>
        <button class="cell" data-index="6" aria-label="Row 3 column 1"></button>
        <button class="cell" data-index="7" aria-label="Row 3 column 2"></button>
        <button class="cell" data-index="8" aria-label="Row 3 column 3"></button>
      </div>

      <div class="controls">
        <button id="newRoundButton" class="primary-button">New Round</button>
        <button id="resetButton" class="secondary-button">Reset Score</button>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
