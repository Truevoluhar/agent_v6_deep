spec:
  source:
    type: Binary
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: openshift/dockerfiles/client.Dockerfile
  output:
    to:
      kind: ImageStreamTag
      name: client:latest
  runPolicy: Serial
