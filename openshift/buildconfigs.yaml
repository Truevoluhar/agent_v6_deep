apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: agent-api
spec:
  source:
    type: Binary
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: openshift/dockerfiles/agent-api.Dockerfile
  output:
    to:
      kind: ImageStreamTag
      name: agent-api:latest
  runPolicy: Serial
---
